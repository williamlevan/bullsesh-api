version: '3.8'

# Development setup - runs only dependencies (PostgreSQL, Redis)
# The API runs locally with `npm run dev`

services:
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=bullsesh
      - POSTGRES_PASSWORD=bullsesh_password
      - POSTGRES_DB=bullsesh
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bullsesh"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
